# Deploys any branch of the backend to the staging (stg) service on Render.
# Run it by hand: Actions, "Backend CD (stg)", "Run workflow", and pick the
# branch in "Use workflow from". The workflow points the stg service at that
# branch, deploys that exact commit, waits until it is live and checks /health.
#
# Needs the repository secret RENDER_API_KEY (Render, Account Settings, API
# Keys) and the repository variable RENDER_BACKEND_STG_SERVICE_ID (the srv-...
# id in the stg service URL). Turn Auto-Deploy off on the stg service so only
# this workflow deploys it.
name: Backend CD (stg)

on:
  workflow_dispatch:

permissions:
  contents: read

# One stg deploy at a time; a newer run waits instead of cancelling a deploy
concurrency:
  group: backend-cd-stg
  cancel-in-progress: false

env:
  RENDER_API: https://api.render.com/v1
  SERVICE_ID: ${{ vars.RENDER_BACKEND_STG_SERVICE_ID }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: backend-stg
      url: ${{ steps.check.outputs.url }}
    steps:
      - name: Check configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::Set the RENDER_API_KEY secret and the RENDER_BACKEND_STG_SERVICE_ID variable"
            exit 1
          fi

      - name: Point stg at ${{ github.ref_name }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BRANCH: ${{ github.ref_name }}
        run: |
          jq -n --arg branch "$BRANCH" '{branch: $branch, autoDeploy: "no"}' \
            | curl -fsS -X PATCH "$RENDER_API/services/$SERVICE_ID" \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                --data @- -o /dev/null

      - name: Deploy ${{ github.sha }}
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT: ${{ github.sha }}
        run: |
          deploy_id=$(jq -n --arg commit "$COMMIT" '{commitId: $commit}' \
            | curl -fsS -X POST "$RENDER_API/services/$SERVICE_ID/deploys" \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                --data @- | jq -r '.id')
          echo "Render deploy $deploy_id"
          echo "id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait until live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
        run: |
          while true; do
            status=$(curl -fsS "$RENDER_API/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy ended with status $status"
                exit 1 ;;
            esac
            sleep 15
          done

      - name: Health check
        id: check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          url=$(curl -fsS "$RENDER_API/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.serviceDetails.url')
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$url/health"
          echo
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed \`${GITHUB_REF_NAME}\` to stg: $url" >> "$GITHUB_STEP_SUMMARY"
