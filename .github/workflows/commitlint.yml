# Checks that every commit of a pull request follows Conventional Commits
# (scripts/check-commits.sh). Runs on every pull request to main, whatever
# files it changes, so main keeps a history the version bump can read.
name: Commit messages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commits.sh "$BASE..$HEAD"
