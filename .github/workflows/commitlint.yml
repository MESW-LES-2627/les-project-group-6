# Checks that every commit of a pull request follows Conventional Commits:
#   <type>(<optional scope>)!: <description>
# GitHub's own "Revert "..."" messages are accepted too. Runs on every pull
# request to main, whatever files it changes, so main keeps a history the
# version bump can read.
name: Commit messages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='build|chore|ci|db|docs|feat|fix|perf|refactor|revert|style|test'
          pattern="^(($types)(\([a-z0-9._/-]+\))?!?: [^ ].*|Revert \".+\")$"
          failed=0
          while IFS= read -r line; do
            sha=${line%% *}
            subject=${line#* }
            if ! grep -qE "$pattern" <<<"$subject"; then
              echo "::error::${sha:0:7} \"$subject\" does not follow <type>(<scope>): <description> (types: ${types//|/, })"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD")
          if [ "$failed" -eq 0 ]; then
            echo "All commits in $BASE..$HEAD follow the convention"
          fi
          exit "$failed"
