# Deploys any branch of the frontend to the staging (stg) static site on Render.
# Run it by hand: Actions, "Frontend CD (stg)", "Run workflow", and pick the
# branch in "Use workflow from". The workflow points the stg site at that
# branch, deploys that exact commit, waits until it is live and checks that
# the site answers.
#
# Needs the repository secret RENDER_API_KEY (Render, Account Settings, API
# Keys) and the repository variable RENDER_FRONTEND_STG_SERVICE_ID (the srv-...
# id in the stg site URL). Turn Auto-Deploy off on the stg site so only this
# workflow deploys it.
name: Frontend CD (stg)

on:
  workflow_dispatch:

permissions:
  contents: read

# One stg deploy at a time; a newer run waits instead of cancelling a deploy
concurrency:
  group: frontend-cd-stg
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/render-deploy
        id: render
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ vars.RENDER_FRONTEND_STG_SERVICE_ID }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          check-path: /

      - name: Summary
        env:
          URL: ${{ steps.render.outputs.url }}
        run: |
          echo "### Deployed \`${GITHUB_REF_NAME}\` to stg: $URL" >> "$GITHUB_STEP_SUMMARY"
