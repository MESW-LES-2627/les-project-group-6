# Checks the backend on every pull request to main when the backend, the shared
# root config or this file change. cd-prod.yml also calls it on every merge.
name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/backend/**
      - docker-compose.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .nvmrc
      - .npmrc
      - .prettierrc.json
      - .prettierignore
      - .github/workflows/backend-ci.yml
  # Called by cd-prod.yml on every merge to main, before the deploy
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: bookmarked_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # Uses the pnpm version pinned in packageManager (root package.json)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bookmarked/backend lint

      - name: Format check
        run: pnpm exec prettier --check apps/backend

      - name: Typecheck
        run: pnpm --filter @bookmarked/backend typecheck

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/bookmarked_dev
        run: pnpm --filter @bookmarked/backend db:migrate

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/bookmarked_dev
          DATABASE_URL_TEST: postgresql://postgres:password123@localhost:5432/bookmarked_dev
        run: pnpm --filter @bookmarked/backend test

      - name: Build
        run: pnpm --filter @bookmarked/backend build

