services:
  db:
    image: postgres:17-alpine
    container_name: bookmarked-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bookmarked_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bookmarked_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
